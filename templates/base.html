<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>🍳 Кулинарная книга</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
      <!-- Подключаем красивые шрифты от Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <!-- Наши новые стили -->
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #fcfcfc;
      color: #333;
    }
    h1, h2, h3, h4, h5, .navbar-brand {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
    }
    .card {
      border: none;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 25px rgba(0,0,0,0.1);
    }
    .btn-primary, .btn-warning, .btn-success {
      border-radius: 8px;
      font-weight: 500;
      padding: 8px 20px;
    }
    a {
      color: #d97706;
      text-decoration: none;
      transition: color 0.2s;
    }
    a:hover {
      color: #b45309;
    }
  </style>
</head>
<body>
<nav class="navbar navbar-dark bg-warning px-3 mb-4">
  <a class="navbar-brand" href="{% url 'recipe_list' %}">🍳 Кулинарная книга</a>
  <div>
    {% if user.is_authenticated %}
      <a href="{% url 'recipe_create' %}" class="btn btn-sm btn-dark me-2">+ Рецепт</a>
      <span class="me-2">{{ user.username }}</span>
      <form method="post" action="{% url 'logout' %}" class="d-inline">{% csrf_token %}
        <button class="btn btn-sm btn-dark">Выйти</button>
      </form>
    {% else %}
      <a href="{% url 'login' %}" class="btn btn-sm btn-dark">Вход</a>
    {% endif %}
  </div>
</nav>
<div class="container">
  {% block content %}{% endblock %}
</div>
</body>
</html>
