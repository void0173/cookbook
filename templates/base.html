<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>🍳 Кулинарная книга</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Подключаем Libre Franklin для текста и Playfair Display для заголовков -->
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <style>
    /* --- БАЗОВЫЕ НАСТРОЙКИ --- */
    body {
      font-family: 'Libre Franklin', sans-serif; /* Новый шрифт */
      background-color: #f8f9fa;
      color: #333333;
    }

    h1, h2, h3, h4, h5, .navbar-brand {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      color: #222222;
    }

    /* --- ШАПКА (Стекло) --- */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(12px);
      background-color: rgba(255, 255, 255, 0.85) !important;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      padding: 15px 0;
    }

    .navbar-brand {
      color: #d97706 !important;
      font-size: 1.6rem;
    }

    .navbar span.me-2 {
      color: #555 !important;
      font-weight: 500;
    }

    /* --- КНОПКИ --- */
    .btn-dark {
      background-color: #333 !important;
      color: #fff !important;
      border: none;
      border-radius: 8px;
      font-weight: 500;
      padding: 8px 16px;
      transition: all 0.2s;
    }
    .btn-dark:hover {
      background-color: #000 !important;
      transform: translateY(-1px);
    }

    .btn-outline-dark {
      border-radius: 8px;
      padding: 8px 16px;
      transition: all 0.2s;
    }

    /* Кнопка Выйти */
    .navbar form button.btn-dark {
      background-color: transparent !important;
      color: #333 !important;
      border: 1px solid #ccc !important;
    }
    .navbar form button.btn-dark:hover {
      background-color: #dc3545 !important;
      color: #fff !important;
      border-color: #dc3545 !important;
    }

    /* --- КАРТОЧКИ РЕЦЕПТОВ --- */
    .card {
      border: none;
      border-radius: 16px;
      background-color: #ffffff;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 25px rgba(0,0,0,0.1);
    }

    .card-body { padding: 1.5rem; }

    .card h5 a {
      color: #222 !important;
      text-decoration: none;
      transition: color 0.2s;
    }
    .card h5 a:hover { color: #d97706 !important; }

    .text-muted { color: #777 !important; }

    .badge.bg-success {
      background-color: #198754 !important;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    /* --- АНИМАЦИИ КАРТОЧЕК --- */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      animation: fadeInUp 0.6s ease-out forwards;
      opacity: 0;
    }
    .col-md-4:nth-child(1) .card { animation-delay: 0.1s; }
    .col-md-4:nth-child(2) .card { animation-delay: 0.2s; }
    .col-md-4:nth-child(3) .card { animation-delay: 0.3s; }
    .col-md-4:nth-child(4) .card { animation-delay: 0.4s; }
    .col-md-4:nth-child(5) .card { animation-delay: 0.5s; }
    .col-md-4:nth-child(6) .card { animation-delay: 0.6s; }

    /* Ссылки на странице */
    a { color: #d97706; text-decoration: none; }
    a:hover { color: #b45309; text-decoration: underline; }

    /* Кнопка Наверх */
    #scrollTopBtn {
      display: none;
      position: fixed;
      bottom: 30px;
      right: 30px;
      z-index: 1000;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      font-size: 24px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      transition: all 0.3s;
    }
    #scrollTopBtn:hover { transform: scale(1.1); }
  </style>
</head>
<body>
<nav class="navbar navbar-dark px-3 mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="{% url 'recipe_list' %}">🍳 Кулинарная книга</a>

    <div class="d-flex align-items-center">
      {% if user.is_authenticated %}
        <!-- Кнопки для авторизованных -->
        <a href="{% url 'favorites_list' %}" class="btn btn-sm btn-outline-danger me-2"><i class="fas fa-heart"></i> Избранное</a>

        <!-- Кнопка + Рецепт ТОЛЬКО для админа -->
        {% if user.is_superuser %}
          <a href="{% url 'recipe_create' %}" class="btn btn-sm btn-dark me-2"><i class="fas fa-plus"></i> Рецепт</a>
        {% endif %}

        <a href="{% url 'random_recipe' %}" class="btn btn-sm btn-outline-dark me-2">🎲 Случайный</a>
        <span class="me-3 fw-bold">{{ user.username }}</span>
        <form method="post" action="{% url 'logout' %}" class="d-inline">{% csrf_token %}
          <button class="btn btn-sm btn-dark"><i class="fas fa-sign-out-alt"></i> Выйти</button>
        </form>
      {% else %}
        <!-- Кнопки для гостей -->
        <a href="{% url 'login' %}" class="btn btn-sm btn-outline-dark me-2"><i class="fas fa-sign-in-alt"></i> Вход</a>
        <a href="{% url 'signup' %}" class="btn btn-sm btn-dark"><i class="fas fa-user-plus"></i> Регистрация</a>
      {% endif %}
    </div>
  </div>
</nav>

<div class="container">
  {% block content %}{% endblock %}
</div>

<!-- Кнопка Наверх -->
<button id="scrollTopBtn" class="btn btn-warning" onclick="scrollToTop()"><i class="fas fa-arrow-up"></i></button>

<script>
  // Логика для кнопки "Наверх"
  window.onscroll = function() {
    const btn = document.getElementById("scrollTopBtn");
    if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
      btn.style.display = "block";
    } else {
      btn.style.display = "none";
    }
  };

  function scrollToTop() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>
</body>
</html>
