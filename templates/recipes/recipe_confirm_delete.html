{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-6">
    <div class="card shadow border-danger">
      <div class="card-header bg-danger text-white">
        <h3 class="mb-0"><i class="fas fa-exclamation-triangle"></i> Удаление рецепта</h3>
      </div>
      <div class="card-body">
        <p class="fs-5">Вы уверены, что хотите удалить рецепт <strong>"{{ recipe.title }}"</strong>?</p>
        <p class="text-muted">Это действие нельзя отменить.</p>

        <form method="post" class="mt-4">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger me-2">Да, удалить</button>
          <a href="{% url 'recipe_detail' recipe.pk %}" class="btn btn-secondary">Отмена</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
