{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h1 class="mb-4">Вход</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary">Войти</button>
    </form>
    <p class="mt-3 text-muted">
      Нет аккаунта? Обратитесь к администратору.
    </p>
  </div>
</div>
{% endblock %}
